models:
  - name: src_hosts
    columns:
      - name: host_id
        tests:
          - not_null
          - unique

  - name: src_listings
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique

      - name: host_id
        tests:
          - not_null
          - relationships:
              to: ref('src_hosts')
              field: host_id

      - name: room_type
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Entire home/apt'
                - 'Private room'
                - 'Shared room'
                - 'Hotel room'