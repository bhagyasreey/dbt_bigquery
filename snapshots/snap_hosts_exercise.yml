snapshots:
  - name: snap_hosts_exercise
    relation: ref('src_hosts')
    description: Historical snapshot of Airbnb host records.

    config:
      unique_key: host_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: new_record

      dbt_valid_to_current: "TIMESTAMP('9999-12-31 23:59:59 UTC')"

      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: snapshot_updated_at
        dbt_is_deleted: is_deleted